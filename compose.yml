services:
  bot:
    build: .
    container_name: aiogram-bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_DIR: /app/data
    volumes:
      - ./data:/app/data
    init: true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"